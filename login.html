<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ManEng BI — Login</title>
  <link rel="stylesheet" href="/maneng-bi/css/main.css">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="brand">man<span>eng</span></div>
      <p>Sistema de Gestão de Manutenção</p>
    </div>
    <h2>Entrar na sua conta</h2>
    <div class="form-group"><label>E-mail</label><input type="email" id="email" placeholder="seu@email.com"></div>
    <div class="form-group"><label>Senha</label><input type="password" id="senha" placeholder="••••••••"></div>
    <div id="erro" style="color:#C00000;font-size:.85rem;margin-bottom:12px;display:none"></div>
    <button class="btn btn-accent" style="width:100%;justify-content:center;padding:11px" onclick="fazerLogin()">Entrar</button>
    <div style="text-align:center;margin-top:14px">
      <a href="#" onclick="mostrarCad()" style="color:var(--accent);font-size:.85rem;text-decoration:none">Primeiro acesso? Criar conta</a>
    </div>
    <div id="form-cad" style="display:none;margin-top:16px;padding-top:16px;border-top:1px solid #e2e8f0">
      <div class="form-group"><label>Nome</label><input type="text" id="cad-nome"></div>
      <div class="form-group"><label>E-mail</label><input type="email" id="cad-email"></div>
      <div class="form-group"><label>Senha (mín. 6 caracteres)</label><input type="password" id="cad-senha"></div>
      <div id="erro-cad" style="color:#C00000;font-size:.85rem;margin-bottom:12px;display:none"></div>
      <button class="btn btn-accent" style="width:100%;justify-content:center;padding:11px" onclick="fazerCad()">Criar conta</button>
      <div style="text-align:center;margin-top:10px">
        <a href="#" onclick="mostrarLogin()" style="color:var(--accent);font-size:.85rem;text-decoration:none">Voltar ao login</a>
      </div>
    </div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="/maneng-bi/js/config.js"></script>
  <script>
    firebase.initializeApp(FIREBASE_CONFIG);
    const auth = firebase.auth();
    auth.onAuthStateChanged(u => { if(u) window.location.href="/maneng-bi/dashboard.html"; });

    async function fazerLogin() {
      const e=document.getElementById("email").value.trim(), s=document.getElementById("senha").value;
      const el=document.getElementById("erro"); el.style.display="none";
      try { await auth.signInWithEmailAndPassword(e,s); }
      catch(err) { el.textContent=trad(err.code); el.style.display="block"; }
    }
