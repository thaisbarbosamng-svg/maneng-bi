<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ManEng BI — Usuários</title>
  <link rel="stylesheet" href="/maneng-bi/css/main.css">
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-logo"><span>man<span class="accent">eng</span></span></div>
    <div id="sidebar"></div>
  </aside>

  <div class="main">
    <div class="topbar"><div class="topbar-title">Gestão de Usuários</div></div>
    <div class="content">
      <div class="table-card">
        <div class="table-header"><h3>Usuários</h3></div>
        <table>
          <thead>
            <tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Status</th><th>Criado em</th><th>Ações</th></tr>
          </thead>
          <tbody id="tabela-users"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal edição -->
  <div id="modal-user" class="modal-overlay" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <h3>Editar Usuário</h3>
        <button class="modal-close" onclick="fecharModal()">✕</button>
      </div>
      <div class="modal-body">
        <p style="margin-bottom:12px"><strong id="user-email"></strong></p>
        <div class="form-group">
          <label>Perfil</label>
          <select id="user-perfil">
            <option value="operador">Operador</option>
            <option value="supervisor">Supervisor</option>
            <option value="pcm">PCM</option>
            <option value="coordenador">Coordenador</option>
            <option value="auditor">Auditor</option>
            <option value="admin">Administrador</option>
          </select>
        </div>
        <div class="form-group">
          <label>Status</label>
          <select id="user-status">
            <option value="ativo">Ativo</option>
            <option value="pendente">Pendente</option>
            <option value="inativo">Inativo</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="fecharModal()">Cancelar</button>
        <button class="btn btn-accent" onclick="salvarUser()">Salvar</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <script src="/maneng-bi/js/config.js"></script>
  <script src="/maneng-bi/js/auth.js"></script>
  <script src="/maneng-bi/js/utils.js"></script>
  <script>
    let todosUsers = [], editandoId = null;

    requireAuth(async (userData) => {
      if (userData.perfil !== "admin") {
        alert("Acesso restrito ao Administrador.");
        window.location.href = "/maneng-bi/dashboard.html"; return;
      }
      renderMenu("usuarios");
      await carregar();
    });

    async function carregar() {
      const snap = await db.collection("usuarios").orderBy("criadoEm","desc").get();
      todosUsers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderTabela();
    }

    function renderTabela() {
      document.getElementById("tabela-users").innerHTML = todosUsers.map(u => `
        <tr>
          <td>${u.nome||"—"}</td>
          <td>${u.email||"—"}</td>
          <td>${PERFIS[u.perfil]?.label || u.perfil || "—"}</td>
          <td><span class="badge badge-${u.status||'pendente'}">${u.status||'pendente'}</span></td>
          <td>${fmtData(u.criadoEm)}</td>
          <td><button class="btn btn-outline btn-xs" onclick="editarUser('${u.id}')">✏ Editar</button></td>
        </tr>`).join("") || `<tr><td colspan="6"><div class="empty-state"><p>Nenhum usuário</p></div></td></tr>`;
    }

    function editarUser(id) {
      editandoId = id;
      const u = todosUsers.find(x => x.id === id);
      document.getElementById("user-email").textContent = `${u.nome} — ${u.email}`;
      document.getElementById("user-perfil").value = u.perfil || "operador";
      document.getElementById("user-status").value = u.status || "pendente";
      document.getElementById("modal-user").style.display = "flex";
    }

    async function salvarUser() {
      if (!editandoId) return;
      const ant = todosUsers.find(u => u.id === editandoId);
      const dados = { perfil: document.getElementById("user-perfil").value, status: document.getElementById("user-status").value };
      await db.collection("usuarios").doc(editandoId).update(dados);
      await registrarLog("usuarios", editandoId, "perfil/status", `${ant.perfil}/${ant.status}`, `${dados.perfil}/${dados.status}`);
      toast("Usuário atualizado!");
      fecharModal();
      await carregar();
    }

    function fecharModal() { document.getElementById("modal-user").style.display="none"; editandoId=null; }
  </script>
</body>
</html>
