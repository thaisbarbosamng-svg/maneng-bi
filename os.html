<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ManEng BI — Ordens de Serviço</title>
  <link rel="stylesheet" href="/maneng-bi/css/main.css">
</head>
<body>
  <aside class="sidebar"><div class="sidebar-logo"><span>man<span class="accent">eng</span></span></div><div id="sidebar"></div></aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-title">Ordens de Serviço</div>
      <div class="topbar-filters">
        <button class="btn btn-outline btn-sm" onclick="exportarOS()" style="color:#fff;border-color:rgba(255,255,255,.3)">⬇ Excel</button>
      </div>
    </div>
    <div class="content">
      <div class="filters-bar">
        <div class="filter-group"><label>Supervisor</label><select id="f-sup" onchange="filtrar()"></select></div>
        <div class="filter-group"><label>Coordenador</label><select id="f-coord" onchange="filtrar()"></select></div>
        <div class="filter-group"><label>Mês</label><select id="f-mes" onchange="filtrar()"></select></div>
        <div class="filter-group"><label>Bandeira</label><select id="f-sigla" onchange="filtrar()"></select></div>
        <div class="filter-group"><label>Status</label><select id="f-status" onchange="filtrar()"></select></div>
        <div class="filter-group"><label>Estado</label><select id="f-estado" onchange="filtrar()"></select></div>
      </div>
      <div class="table-card">
        <div class="table-header"><h3>Ordens de Serviço <span id="contador" style="color:#718096;font-size:.85rem;font-weight:400"></span></h3></div>
        <div id="loading" class="loading"><div class="spinner"></div> Carregando...</div>
        <div style="overflow-x:auto" id="twrap">
          <table>
            <thead><tr><th>Bandeira</th><th>Unidade</th><th>Supervisor</th><th>PCM</th><th>Mês</th><th>Status</th><th>Início</th><th>Término</th><th>Periodicidade</th></tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <div class="pagination" id="pag"></div>
      </div>
    </div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <script src="/maneng-bi/js/config.js"></script>
  <script src="/maneng-bi/js/auth.js"></script>
  <script>
    let todos=[], filtrados=[], pg=1; const PP=50;
    requireAuth(async()=>{
      renderMenu("os");
      try{
        todos=await carregarDados();
        popularSelect("f-sup",   todos,"supervisao", "Todos");
        popularSelect("f-coord", todos,"coordenador","Todos");
        popularSelect("f-sigla", todos,"sigla",      "Todas");
        popularSelect("f-estado",todos,"estado",     "Todos");
        const sv=[...new Set(todos.map(o=>normalizarStatus(o.status)).filter(Boolean))].sort();
        document.getElementById("f-status").innerHTML=`<option value="">Todos</option>`+sv.map(s=>`<option>${s}</option>`).join("");
        const mv=[...new Set(todos.map(o=>o.mes).filter(Boolean))];
        document.getElementById("f-mes").innerHTML=`<option value="">Todos</option>`+mv.map(m=>`<option>${m}</option>`).join("");
        document.getElementById("loading").style.display="none";
        filtrar();
      }catch(e){document.getElementById("loading").innerHTML=`<span style="color:#C00000">${e.message}</span>`;}
    });

    function filtrar(){
      const sup=document.getElementById("f-sup").value,coord=document.getElementById("f-coord").value,
            mes=document.getElementById("f-mes").value,sigla=document.getElementById("f-sigla").value,
            status=document.getElementById("f-status").value,estado=document.getElementById("f-estado").value;
      filtrados=todos.filter(o=>{
        if(sup   &&o.supervisao !==sup)   return false;
        if(coord &&o.coordenador!==coord) return false;
        if(mes   &&(o.mes||"").toUpperCase()!==mes) return false;
        if(sigla &&o.sigla      !==sigla) return false;
        if(estado&&o.estado     !==estado)return false;
        if(status&&normalizarStatus(o.status)!==status)return false;
        return true;
      });
      pg=1; renderT();
    }

      const ini=(pg-1)*PP, p=filtrados.slice(ini,ini+PP);
      document.getElementById("contador").textContent=`(${filtrados.length})`;
      document.getElementById("tbody").innerHTML=p.length?p.map(o=>`
        <tr>
          <td><strong>${o.sigla||"—"}</strong></td>
          <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${o.cliente||"—"}</td>
          <td>${o.supervisao||"—"}</td>
          <td>${o.pcm||"—"}</td>
          <td>${o.mes||"—"} ${o.ano||""}</td>
          <td>${statusChip(o.status)}</td>
          <td>${o.dataInicio||"—"}</td>
          <td>${o.dataTermino||"—"}</td>
          <td>${o.periodicidade||"—"}</td>
        </tr>`).join("")
        :`<tr><td colspan="9"><div class="empty-state"><div class="empty-icon">📋</div><p>Nenhuma OS encontrada</p></div></td></tr>`;
      const tp=Math.ceil(filtrados.length/PP);
