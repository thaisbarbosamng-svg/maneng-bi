<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ManEng BI — Cronograma</title>
  <link rel="stylesheet" href="/maneng-bi/css/main.css">
  <style>
    .crono-wrap { overflow-x: auto; }
    .crono-table { border-collapse: collapse; min-width: 900px; width: 100%; font-size: .78rem; }
    .crono-table th { background: var(--primary); color: rgba(255,255,255,.85); padding: 7px 6px; text-align: center; font-size: .7rem; white-space: nowrap; position: sticky; top: 0; z-index: 10; }
    .crono-table th.col-cliente { text-align: left; min-width: 200px; }
    .crono-table td { padding: 3px 4px; border: 1px solid #e2e8f0; vertical-align: middle; }
    .crono-table tr:hover { background: #f7fafc; }
    .crono-table td.col-cliente { font-size: .8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; padding: 4px 8px; }
    .crono-table td.col-sigla { font-weight: 700; font-size: .75rem; color: #4a5568; text-align: center; }
    .dia-slot {
      width: 28px; height: 26px; border-radius: 4px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: .68rem; font-weight: 600; margin: 1px; transition: opacity .15s;
    }
    .dia-slot:hover { opacity: .8; }
    .dia-slot.vazio { background: transparent; cursor: default; }
    .dia-slot.hoje { outline: 2px solid #FF6B35; }
    .legend { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: .75rem; }
    .legend-dot { width: 14px; height: 14px; border-radius: 3px; }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-logo"><span>man<span class="accent">eng</span></span></div>
    <div id="sidebar"></div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="topbar-title">Cronograma de Manutenção</div>
      <div class="topbar-filters">
        <select id="f-vis">
          <option value="mensal">Mensal</option>
          <option value="anual">Anual</option>
        </select>
        <select id="f-mes-crono"></select>
        <select id="f-ano-crono"></select>
        <select id="f-sup-crono"><option value="">Todos supervisores</option></select>
        <button class="btn btn-outline btn-sm" onclick="exportarCrono()" style="color:#fff;border-color:rgba(255,255,255,.3)">⬇ Excel</button>
      </div>
    </div>

    <div class="content">
      <!-- Legenda -->
      <div class="chart-card" style="margin-bottom:16px;padding:12px 18px">
        <div class="legend" id="legend"></div>
      </div>

      <div class="table-card">
        <div class="table-header">
          <h3 id="titulo-crono">Cronograma</h3>
          <div style="font-size:.8rem;color:#718096">Clique em uma célula para editar o status</div>
        </div>
        <div id="loading-crono" class="loading"><div class="spinner"></div> Carregando...</div>
        <div class="crono-wrap" id="crono-wrap" style="display:none">
          <table class="crono-table" id="crono-table"></table>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal edição de data -->
  <div id="modal-crono" class="modal-overlay" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <h3>Editar Agendamento</h3>
        <button class="modal-close" onclick="fecharModalCrono()">✕</button>
      </div>
      <div class="modal-body">
        <p style="margin-bottom:12px"><strong id="crono-os-nome"></strong></p>
        <div class="form-row">
          <div class="form-group">
            <label>Data de Início</label>
            <input type="date" id="crono-data-inicio">
          </div>
          <div class="form-group">
            <label>Data de Término</label>
            <input type="date" id="crono-data-termino">
          </div>
        </div>
        <div class="form-group">
          <label>Status</label>
          <select id="crono-status-sel"></select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="fecharModalCrono()">Cancelar</button>
        <button class="btn btn-accent" onclick="salvarCrono()">Salvar</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <script src="/maneng-bi/js/config.js"></script>
  <script src="/maneng-bi/js/auth.js"></script>
  <script src="/maneng-bi/js/utils.js"></script>
  <script>
    let todosOS = [];
    let osEditando = null;

    requireAuth(async () => {
      renderMenu("cronograma");
      popularMesAno();
      await carregarOS();
      document.getElementById("f-vis").addEventListener("change", renderCronograma);
      document.getElementById("f-mes-crono").addEventListener("change", renderCronograma);
      document.getElementById("f-ano-crono").addEventListener("change", renderCronograma);
      document.getElementById("f-sup-crono").addEventListener("change", renderCronograma);
    });

    function popularMesAno() {
      const anoAtual = new Date().getFullYear();
      const mesAtual = new Date().getMonth(); // 0-indexed
      document.getElementById("f-mes-crono").innerHTML =
        MESES.map((m, i) => `<option value="${i+1}" ${i===mesAtual?'selected':''}>${m}</option>`).join("");
      let anosOpt = "";
      for (let a = anoAtual - 1; a <= anoAtual + 1; a++)
        anosOpt += `<option value="${a}" ${a===anoAtual?'selected':''}>${a}</option>`;
      document.getElementById("f-ano-crono").innerHTML = anosOpt;
    }

    async function carregarOS() {
      const snap = await db.collection("ordens_servico").get();
      todosOS = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      popularSelect("f-sup-crono", todosOS, "supervisao", "Todos supervisores");
      renderLegenda();
      renderCronograma();
    }

    function renderLegenda() {
      const statusUsados = [...new Set(todosOS.map(o => o.status).filter(Boolean))];
      document.getElementById("legend").innerHTML = statusUsados.map(s => {
        const cfg = STATUS_CONFIG[s] || { cor: "#999" };
        return `<div class="legend-item"><div class="legend-dot" style="background:${cfg.cor}"></div>${s}</div>`;
      }).join("");
    }

    function renderCronograma() {
      const vis  = document.getElementById("f-vis").value;
      const mes  = parseInt(document.getElementById("f-mes-crono").value);
      const ano  = parseInt(document.getElementById("f-ano-crono").value);
      const sup  = document.getElementById("f-sup-crono").value;
      const mesMask = MESES[mes - 1];

      let lista = todosOS.filter(o => {
        if (sup && o.supervisao !== sup) return false;
        if (vis === "mensal") return o.mes === mesMask && String(o.ano) === String(ano);
        return String(o.ano) === String(ano);
      });

      document.getElementById("titulo-crono").textContent =
        vis === "mensal" ? `Cronograma — ${mesMask}/${ano}` : `Cronograma Anual — ${ano}`;
      document.getElementById("loading-crono").style.display = "none";
      document.getElementById("crono-wrap").style.display = "block";

      if (vis === "mensal") renderMensal(lista, ano, mes);
      else renderAnual(lista, ano);
    }

    function renderMensal(lista, ano, mes) {
      const diasNoMes = new Date(ano, mes, 0).getDate();
      const hoje = new Date();
      let thead = `<tr><th class="col-sigla">Sigla</th><th class="col-cliente">Unidade / Supervisor</th>`;
      for (let d = 1; d <= diasNoMes; d++) thead += `<th>${d}</th>`;
      thead += `</tr>`;

      const rows = lista.map(os => {
        let inicio = os.dataInicio ? (os.dataInicio.toDate ? os.dataInicio.toDate() : new Date(os.dataInicio)) : null;
        let termino = os.dataTermino ? (os.dataTermino.toDate ? os.dataTermino.toDate() : new Date(os.dataTermino)) : null;
        const cfg = STATUS_CONFIG[os.status] || { cor: "#e2e8f0", texto: "#333" };
        let diasHtml = "";
        for (let d = 1; d <= diasNoMes; d++) {
          const dt = new Date(ano, mes - 1, d);
          const ehHoje = dt.toDateString() === hoje.toDateString();
          let cor = "";
          if (inicio && termino) {
            if (dt >= inicio && dt <= termino) cor = cfg.cor;
          } else if (inicio && dt.getDate() === inicio.getDate() && dt.getMonth() === inicio.getMonth()) {
            cor = cfg.cor;
          }
          diasHtml += `<td style="text-align:center;padding:2px">
            <div class="dia-slot ${cor?'':'vazio'} ${ehHoje?'hoje':''}"
              style="${cor?`background:${cor};color:${cfg.texto||'#fff'}`:'opacity:.3'}"
              onclick="${cor?`abrirModalCrono('${os.id}')`:''}">
              ${cor ? "✓" : ""}
            </div></td>`;
        }
        return `<tr>
          <td class="col-sigla">${os.sigla||"—"}</td>
          <td class="col-cliente" title="${os.cliente||''}">${os.cliente||"—"}<br>
            <span style="color:#718096;font-size:.7rem">${os.supervisao||""}</span></td>
          ${diasHtml}
        </tr>`;
      });

      document.getElementById("crono-table").innerHTML =
        `<thead>${thead}</thead><tbody>${rows.join("") || '<tr><td colspan="33"><div class="empty-state"><div class="empty-icon">📅</div><p>Nenhuma OS encontrada para este período</p></div></td></tr>'}</tbody>`;
    }

    function renderAnual(lista, ano) {
      let thead = `<tr><th class="col-sigla">Sigla</th><th class="col-cliente">Unidade</th>`;
      MESES.forEach(m => thead += `<th>${m.slice(0,3)}</th>`);
      thead += "</tr>";

      const rows = lista.map(os => {
        let mesesHtml = "";
        MESES.forEach(m => {
          const temOS = os.mes === m;
          const cfg = STATUS_CONFIG[os.status] || { cor: "#e2e8f0" };
          mesesHtml += `<td style="text-align:center;padding:2px">
            <div class="dia-slot ${temOS?'':'vazio'}"
              style="${temOS?`background:${cfg.cor};color:#fff`:'opacity:.2'}"
              onclick="${temOS?`abrirModalCrono('${os.id}')`:''}">
              ${temOS ? "●" : ""}
            </div></td>`;
        });
        return `<tr>
          <td class="col-sigla">${os.sigla||"—"}</td>
          <td class="col-cliente" title="${os.cliente||''}">${os.cliente||"—"}</td>
          ${mesesHtml}
        </tr>`;
      });

      document.getElementById("crono-table").innerHTML =
        `<thead>${thead}</thead><tbody>${rows.join("") || '<tr><td colspan="14"><div class="empty-state"><div class="empty-icon">📅</div><p>Nenhuma OS encontrada</p></div></td></tr>'}</tbody>`;
    }

    function abrirModalCrono(osId) {
      osEditando = todosOS.find(o => o.id === osId);
      if (!osEditando) return;
      document.getElementById("crono-os-nome").textContent = `${osEditando.sigla} — ${osEditando.cliente}`;
      const di = osEditando.dataInicio ? (osEditando.dataInicio.toDate ? osEditando.dataInicio.toDate() : new Date(osEditando.dataInicio)) : null;
      const dt = osEditando.dataTermino ? (osEditando.dataTermino.toDate ? osEditando.dataTermino.toDate() : new Date(osEditando.dataTermino)) : null;
      document.getElementById("crono-data-inicio").value  = di ? di.toISOString().slice(0,10) : "";
      document.getElementById("crono-data-termino").value = dt ? dt.toISOString().slice(0,10) : "";
      const statusList = Object.keys(STATUS_CONFIG);
      document.getElementById("crono-status-sel").innerHTML =
        statusList.map(s => `<option value="${s}" ${s===osEditando.status?'selected':''}>${s}</option>`).join("");
      document.getElementById("modal-crono").style.display = "flex";
    }

    function fecharModalCrono() {
      document.getElementById("modal-crono").style.display = "none";
      osEditando = null;
    }

    async function salvarCrono() {
      if (!osEditando) return;
      const inicio  = document.getElementById("crono-data-inicio").value;
      const termino = document.getElementById("crono-data-termino").value;
      const status  = document.getElementById("crono-status-sel").value;
      const updates = {
        status,
        alteradoManualmente: true,
        alteradoPor: currentUserData.nome,
        alteradoEm: firebase.firestore.FieldValue.serverTimestamp()
      };
      if (inicio)  updates.dataInicio  = firebase.firestore.Timestamp.fromDate(new Date(inicio));
      if (termino) updates.dataTermino = firebase.firestore.Timestamp.fromDate(new Date(termino));
      await db.collection("ordens_servico").doc(osEditando.id).update(updates);
      await registrarLog("cronograma", osEditando.id, "datas/status", osEditando.status, status);
      toast("Cronograma atualizado!");
      fecharModalCrono();
      await carregarOS();
    }

    function exportarCrono() {
      const vis = document.getElementById("f-vis").value;
      const mes = parseInt(document.getElementById("f-mes-crono").value);
      const ano = parseInt(document.getElementById("f-ano-crono").value);
      const sup = document.getElementById("f-sup-crono").value;
      const mesMask = MESES[mes - 1];
      let lista = todosOS.filter(o => {
        if (sup && o.supervisao !== sup) return false;
        if (vis === "mensal") return o.mes === mesMask && String(o.ano) === String(ano);
        return String(o.ano) === String(ano);
      });
      const dados = lista.map(os => ({
        Sigla: os.sigla, Unidade: os.cliente, Supervisor: os.supervisao,
        Mês: os.mes, Ano: os.ano, Status: os.status,
        DataInicio: fmtData(os.dataInicio), DataTermino: fmtData(os.dataTermino),
        Periodicidade: os.periodicidade
      }));
      exportarExcel(dados, `cronograma_${vis}_${ano}`);
    }
  </script>
</body>
</html>
