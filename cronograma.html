<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ManEng BI — Cronograma</title>
  <link rel="stylesheet" href="/maneng-bi/css/main.css">
  <style>
    .crono-wrap{overflow-x:auto}
    .crono-table{border-collapse:collapse;min-width:900px;width:100%;font-size:.78rem}
    .crono-table th{background:var(--primary);color:rgba(255,255,255,.85);padding:7px 6px;text-align:center;font-size:.7rem;white-space:nowrap}
    .crono-table th.col-c{text-align:left;min-width:200px}
    .crono-table td{padding:3px 4px;border:1px solid #e2e8f0;vertical-align:middle}
    .crono-table tr:hover{background:#f7fafc}
    .crono-table td.col-c{font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;padding:4px 8px}
    .crono-table td.col-s{font-weight:700;font-size:.75rem;color:#4a5568;text-align:center}
    .sb{display:inline-block;padding:2px 10px;border-radius:12px;font-size:.72rem;font-weight:600;white-space:nowrap}
    .legend{display:flex;flex-wrap:wrap;gap:8px}
    .legend-item{display:flex;align-items:center;gap:5px;font-size:.72rem}
    .legend-dot{width:12px;height:12px;border-radius:3px;flex-shrink:0}
    .dia-cel{width:26px;height:24px;border-radius:4px;margin:1px auto;display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:600;cursor:pointer;transition:opacity .15s}
    .dia-cel:hover{opacity:.75!important}
  </style>
</head>
<body>
  <aside class="sidebar"><div class="sidebar-logo"><span>man<span class="accent">eng</span></span></div><div id="sidebar"></div></aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-title">Cronograma de Manutenção</div>
      <div class="topbar-filters">
        <select id="f-vis"><option value="mensal">Mensal</option><option value="anual">Anual</option></select>
        <select id="f-mes"></select>
        <select id="f-ano"></select>
        <select id="f-sup"><option value="">Todos supervisores</option></select>
        <button onclick="abrirGerar()" style="background:#e8631a;color:#fff;border:none;padding:7px 14px;border-radius:6px;cursor:pointer;font-size:.85rem;font-weight:600">⚡ Gerar Cronograma</button>
        <button class="btn btn-outline btn-sm" onclick="exportarCrono()" style="color:#fff;border-color:rgba(255,255,255,.3)">⬇ Excel</button>
      </div>
    </div>
    <div class="content">
      <div class="chart-card" style="margin-bottom:16px;padding:12px 18px"><div class="legend" id="legend"></div></div>
      <div class="table-card">
        <div class="table-header"><h3 id="titulo">Cronograma</h3><span style="font-size:.8rem;color:#718096">Clique em uma célula para ver detalhes</span></div>
        <div id="loading" class="loading"><div class="spinner"></div> Carregando...</div>
        <div class="crono-wrap" id="crono-wrap" style="display:none">
          <table class="crono-table" id="crono-table"></table>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal detalhes -->
  <div id="modal" class="modal-overlay" style="display:none">
    <div class="modal">
      <div class="modal-header"><h3 id="modal-titulo">Detalhes</h3><button class="modal-close" onclick="document.getElementById('modal').style.display='none'">✕</button></div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer"><button class="btn btn-outline" onclick="document.getElementById('modal').style.display='none'">Fechar</button></div>
    </div>
  </div>

  <!-- Modal gerar -->
  <div id="modal-gerar" class="modal-overlay" style="display:none">
    <div class="modal" style="max-width:480px">
      <div class="modal-header"><h3>⚡ Gerar Cronograma</h3><button class="modal-close" onclick="document.getElementById('modal-gerar').style.display='none'">✕</button></div>
      <div class="modal-body">
        <p style="margin-bottom:16px;color:#718096;font-size:.875rem">Gera cronograma baseado na última manutenção concluída + periodicidade de cada unidade.</p>
        <div class="form-row">
          <div class="form-group"><label>Mês *</label>
            <select id="g-mes"></select>
          </div>
          <div class="form-group"><label>Ano *</label><input type="number" id="g-ano" value="2026" min="2024" max="2030"></div>
        </div>
        <div class="form-group"><label>Supervisor (opcional)</label><select id="g-sup"><option value="">Todos</option></select></div>
        <div id="g-preview" style="background:#f7fafc;border-radius:8px;padding:12px;margin-top:8px;font-size:.85rem;display:none"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="document.getElementById('modal-gerar').style.display='none'">Cancelar</button>
        <button class="btn btn-outline" onclick="previewGerar()">👁 Preview</button>
        <button class="btn btn-accent" onclick="exportarGerado()">⬇ Exportar Excel</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <script src="/maneng-bi/js/config.js"></script>
  <script src="/maneng-bi/js/auth.js"></script>
  <script>
    let todosOS=[], geradoPreview=[];

    requireAuth(async()=>{
      renderMenu("cronograma");
      const am=new Date().getFullYear(), mm=MESES[new Date().getMonth()];
      document.getElementById("f-mes").innerHTML=MESES.map((m,i)=>`<option value="${m}"${m===mm?" selected":""}>${m}</option>`).join("");
      document.getElementById("g-mes").innerHTML=MESES.map((m,i)=>`<option value="${m}"${m===mm?" selected":""}>${m}</option>`).join("");
      let ao="";for(let a=am-1;a<=am+1;a++)ao+=`<option value="${a}"${a===am?" selected":""}>${a}</option>`;
      document.getElementById("f-ano").innerHTML=ao;
      try{
        todosOS=await carregarDados();
        popularSelect("f-sup", todosOS,"supervisao","Todos supervisores");
        popularSelect("g-sup", todosOS,"supervisao","Todos");
        renderLegenda();
        renderCronograma();
        ["f-vis","f-mes","f-ano","f-sup"].forEach(id=>document.getElementById(id).addEventListener("change",renderCronograma));
        document.getElementById("loading").style.display="none";
        document.getElementById("crono-wrap").style.display="block";
      }catch(e){document.getElementById("loading").innerHTML=`<span style="color:#C00000">${e.message}</span>`;}
    });

    function renderLegenda(){
      const u=[...new Set(todosOS.map(o=>normalizarStatus(o.status)).filter(Boolean))];
      document.getElementById("legend").innerHTML=u.map(s=>{const c=STATUS_CONFIG[s]||{cor:"#999"};return`<div class="legend-item"><div class="legend-dot" style="background:${c.cor}"></div>${s}</div>`;}).join("");
    }

    function renderCronograma(){
      const vis=document.getElementById("f-vis").value,mes=document.getElementById("f-mes").value,
            ano=document.getElementById("f-ano").value,sup=document.getElementById("f-sup").value;
      let lista=todosOS.filter(o=>{
        if(sup&&o.supervisao!==sup)return false;
        if(vis==="mensal")return(o.mes||"").toUpperCase()===mes&&String(o.ano)===String(ano);
        return String(o.ano)===String(ano);
      });
      document.getElementById("titulo").textContent=vis==="mensal"?`Cronograma — ${mes}/${ano}`:`Cronograma Anual — ${ano}`;
      if(vis==="mensal")renderMensal(lista,ano,MESES.indexOf(mes)+1);
      else renderAnual(lista,ano);
    }

    function renderMensal(lista,ano,mn){
      const dias=new Date(ano,mn,0).getDate(),hoje=new Date();
      let th=`<tr><th class="col-s">Sigla</th><th class="col-c">Unidade / Supervisor</th><th>Status</th>`;
      for(let d=1;d<=dias;d++){const dt=new Date(ano,mn-1,d);th+=`<th style="${dt.toDateString()===hoje.toDateString()?"background:#e8631a;color:#fff":""}">${d}</th>`;}
      th+="</tr>";
      if(!lista.length){document.getElementById("crono-table").innerHTML=`<thead>${th}</thead><tbody><tr><td colspan="${dias+3}"><div class="empty-state"><div class="empty-icon">📅</div><p>Nenhuma OS para este período</p></div></td></tr></tbody>`;return;}
      const rows=lista.map(os=>{
        const st=normalizarStatus(os.status),cfg=STATUS_CONFIG[st]||{cor:"#e2e8f0",texto:"#333"};
        let di=null,df=null;
        if(os.dataInicio){try{const p=os.dataInicio.includes("/")?os.dataInicio.split("/"):[os.dataInicio.slice(8),os.dataInicio.slice(5,7),os.dataInicio.slice(0,4)];di=new Date(`${p[2]}-${p[1].padStart(2,"0")}-${p[0].padStart(2,"0")}`);}catch(e){}}
        if(os.dataTermino){try{const p=os.dataTermino.includes("/")?os.dataTermino.split("/"):[os.dataTermino.slice(8),os.dataTermino.slice(5,7),os.dataTermino.slice(0,4)];df=new Date(`${p[2]}-${p[1].padStart(2,"0")}-${p[0].padStart(2,"0")}`);}catch(e){}}
        let dh="";
        for(let d=1;d<=dias;d++){
          const dt=new Date(ano,mn-1,d),eh=dt.toDateString()===new Date().toDateString();
          let ok=false;
          if(di&&df)ok=dt>=di&&dt<=df;
          else if(di)ok=dt.toDateString()===di.toDateString();
          dh+=`<td style="text-align:center;padding:1px"><div class="dia-cel" style="background:${ok?cfg.cor:"#f0f4f8"};color:${ok?cfg.texto||"#fff":"#ccc"};opacity:${ok?1:.5};${eh?"outline:2px solid #FF6B35":""}" onclick="verOS('${os.id}')">${ok?"✓":""}</div></td>`;
        }
        const sb=`<span class="sb" style="background:${cfg.cor};color:${cfg.texto||"#fff"}">${st}</span>`;
        return`<tr><td class="col-s">${os.sigla||"—"}</td><td class="col-c" title="${os.cliente||""}">${os.cliente||"—"}<br><span style="color:#718096;font-size:.7rem">${os.supervisao||""}</span></td><td style="white-space:nowrap">${sb}</td>${dh}</tr>`;
      });
      document.getElementById("crono-table").innerHTML=`<thead>${th}</thead><tbody>${rows.join("")}</tbody>`;
    }

    function renderAnual(lista,ano){
      let th=`<tr><th class="col-s">Sigla</th><th class="col-c">Unidade</th>`;
      MESES.forEach(m=>th+=`<th>${m.slice(0,3)}</th>`);th+="</tr>";
      const rows=lista.map(os=>{
        let mh="";
        MESES.forEach(m=>{const ok=(os.mes||"").toUpperCase()===m;const cfg=STATUS_CONFIG[normalizarStatus(os.status)]||{cor:"#e2e8f0"};
          mh+=`<td style="text-align:center;padding:2px"><div class="dia-cel" style="background:${ok?cfg.cor:"transparent"};color:#fff;opacity:${ok?1:.15}" onclick="${ok?`"verOS('${os.id}')"`:"\"\""}"">${ok?"●":""}</div></td>`;
        });
        return`<tr><td class="col-s">${os.sigla||"—"}</td><td class="col-c">${os.cliente||"—"}</td>${mh}</tr>`;
      });
      document.getElementById("crono-table").innerHTML=`<thead>${th}</thead><tbody>${rows.join("")||'<tr><td colspan="14"><div class="empty-state"><p>Nenhuma OS</p></div></td></tr>'}</tbody>`;
    }

    function verOS(id){
      const os=todosOS.find(o=>o.id===id);if(!os)return;
      document.getElementById("modal-titulo").textContent=`${os.sigla} — ${os.cliente}`;
      document.getElementById("modal-body").innerHTML=`
        <table style="width:100%;font-size:.875rem">
          <tr><td style="color:#718096;padding:4px 0;width:130px">Unidade</td><td>${os.cliente||"—"}</td></tr>
          <tr><td style="color:#718096;padding:4px 0">Supervisor</td><td>${os.supervisao||"—"}</td></tr>
          <tr><td style="color:#718096;padding:4px 0">PCM</td><td>${os.pcm||"—"}</td></tr>
          <tr><td style="color:#718096;padding:4px 0">Status</td><td>${statusChip(os.status)}</td></tr>
          <tr><td style="color:#718096;padding:4px 0">Mês/Ano</td><td>${os.mes||"—"} / ${os.ano||"—"}</td></tr>
          <tr><td style="color:#718096;padding:4px 0">Início</td><td>${os.dataInicio||"—"}</td></tr>
          <tr><td style="color:#718096;padding:4px 0">Término</td><td>${os.dataTermino||"—"}</td></tr>
          <tr><td style="color:#718096;padding:4px 0">Periodicidade</td><td>${os.periodicidade||"—"}</td></tr>
        </table>`;
      document.getElementById("modal").style.display="flex";
    }

    function abrirGerar(){document.getElementById("g-preview").style.display="none";document.getElementById("modal-gerar").style.display="flex";}

    function previewGerar(){
      const mes=document.getElementById("g-mes").value,ano=parseInt(document.getElementById("g-ano").value),sup=document.getElementById("g-sup").value;
      geradoPreview=calcularProximasManu(mes,ano,sup);
      const prev=document.getElementById("g-preview");
      prev.style.display="block";
      prev.innerHTML=geradoPreview.length>0
        ?`✅ <strong>${geradoPreview.length}</strong> unidades com manutenção prevista para <strong>${mes}/${ano}</strong>.`
        :`⚠️ Nenhuma unidade com manutenção prevista para ${mes}/${ano}.<br><small>Verifique se há OS concluídas com periodicidade e datas preenchidas.</small>`;
    }

    function calcularProximasManu(mes,ano,sup){
      const OK=["CONCLUIDA","CONCLUIDO","VALIDADA","CONFORME CRONOGRAMA","AUDITADA","FATURADA"];
      const PERI={"MENSAL":30,"BIMESTRAL":60,"TRIMESTRAL":90,"SEMESTRAL":180,"ANUAL":365};
      const mi=MESES.indexOf(mes),inicioMes=new Date(ano,mi,1),fimMes=new Date(ano,mi+1,0);
      const porUnidade={};
      todosOS.forEach(os=>{
        if(sup&&os.supervisao!==sup)return;
        if(!OK.includes(normalizarStatus(os.status)))return;
        if(!os.dataTermino)return;
        const chave=`${os.sigla}|${os.cliente}`;
        const partes=os.dataTermino.includes("/")?os.dataTermino.split("/").reverse():os.dataTermino.split("-");
        const dt=new Date(`${partes[0]}-${String(partes[1]).padStart(2,"0")}-${String(partes[2]).padStart(2,"0")}`);
        if(isNaN(dt))return;
        if(!porUnidade[chave]||dt>porUnidade[chave].dt)porUnidade[chave]={os,dt};
      });
      const jaTemNoMes=new Set();
      todosOS.forEach(os=>{if((os.mes||"").toUpperCase()===mes&&String(os.ano)===String(ano))jaTemNoMes.add(`${os.sigla}|${os.cliente}`);});
      const result=[];
      Object.entries(porUnidade).forEach(([chave,{os,dt}])=>{
        if(jaTemNoMes.has(chave))return;
        const per=(os.periodicidade||"MENSAL").toUpperCase(),dias=PERI[per]||30;
        const prox=new Date(dt);prox.setDate(prox.getDate()+dias);
        if(prox>=inicioMes&&prox<=fimMes){
          const fim=new Date(prox);fim.setDate(fim.getDate()+2);
          result.push({...os,mes,ano:String(ano),status:"PROGRAMADO",dataInicio:prox.toLocaleDateString("pt-BR"),dataTermino:fim.toLocaleDateString("pt-BR")});
        }
      });
      return result;
    }

    function exportarGerado(){
      if(!geradoPreview.length){previewGerar();if(!geradoPreview.length)return;}
      exportarExcel(geradoPreview.map(o=>({Bandeira:o.sigla,Unidade:o.cliente,Supervisor:o.supervisao,PCM:o.pcm,Mês:o.mes,Ano:o.ano,Status:o.status,DataInicio:o.dataInicio,DataTermino:o.dataTermino,Periodicidade:o.periodicidade})),`cronograma_gerado_${document.getElementById("g-mes").value}_${document.getElementById("g-ano").value}`);
    }

    function exportarCrono(){
      const vis=document.getElementById("f-vis").value,mes=document.getElementById("f-mes").value,ano=document.getElementById("f-ano").value,sup=document.getElementById("f-sup").value;
      const lista=todosOS.filter(o=>{if(sup&&o.supervisao!==sup)return false;if(vis==="mensal")return(o.mes||"").toUpperCase()===mes&&String(o.ano)===String(ano);return String(o.ano)===String(ano);});
      exportarExcel(lista.map(o=>({Sigla:o.sigla,Unidade:o.cliente,Supervisor:o.supervisao,Mês:o.mes,Ano:o.ano,Status:o.status,DataInicio:o.dataInicio,DataTermino:o.dataTermino,Periodicidade:o.periodicidade})),`cronograma_${ano}`);
    }
  </script>
</body>
</html>
