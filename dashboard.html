<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ManEng BI — Dashboard</title>
  <link rel="stylesheet" href="/maneng-bi/css/main.css">
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-logo"><span>man<span class="accent">eng</span></span></div>
    <div id="sidebar"></div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-title">Dashboard Manutenção</div>
      <div class="topbar-filters">
        <select id="f-mes"></select>
        <select id="f-ano"></select>
        <select id="f-supervisor"><option value="">Todos supervisores</option></select>
        <select id="f-coordenador"><option value="">Todos coordenadores</option></select>
        <select id="f-estado"><option value="">Todos os estados</option></select>
      </div>
    </div>
    <div class="content">
      <div id="loading" class="loading"><div class="spinner"></div> Carregando dados...</div>
      <div id="dashboard-content" style="display:none">
        <div class="kpi-grid" id="kpi-grid"></div>
        <div class="charts-grid">
          <div class="chart-card"><h3>Taxa de Conclusão</h3>
            <canvas id="chart-gauge"></canvas>
            <div id="gauge-val" style="text-align:center;font-size:2rem;font-weight:700;margin-top:8px;color:#1a2a4a"></div>
          </div>
          <div class="chart-card"><h3>Cronograma</h3><canvas id="chart-cronograma"></canvas></div>
        </div>
        <div class="charts-grid">
          <div class="chart-card"><h3>Distribuição por Status</h3><canvas id="chart-pizza"></canvas></div>
          <div class="chart-card"><h3>Conclusão por Supervisor</h3>
            <div style="overflow-y:auto;max-height:300px"><canvas id="chart-supervisor"></canvas></div>
          </div>
        </div>
        <div class="table-card">
          <div class="table-header">
            <h3>Resumo por Supervisor</h3>
            <button class="btn btn-outline btn-sm" onclick="exportarResumo()">⬇ Excel</button>
          </div>
          <table>
            <thead><tr><th>Supervisor</th><th>Programadas</th><th>Concluídas</th><th>Em Execução</th><th>Em Atraso</th><th>Sem Equipe</th><th>Taxa %</th></tr></thead>
            <tbody id="tabela-supervisores"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <script src="/maneng-bi/js/config.js"></script>
  <script src="/maneng-bi/js/auth.js"></script>
  <script src="/maneng-bi/js/utils.js"></script>
  <script>
    let dadosAtuais = [], chartGauge, chartCrono, chartPizza, chartSup;
    const MESES_LIST = ["JANEIRO","FEVEREIRO","MARÇO","ABRIL","MAIO","JUNHO","JULHO","AGOSTO","SETEMBRO","OUTUBRO","NOVEMBRO","DEZEMBRO"];

    requireAuth(async () => {
      renderMenu("dashboard");
      popularMesAno();
      await carregarTodos();
      document.getElementById("f-mes").addEventListener("change", renderDashboard);
      document.getElementById("f-ano").addEventListener("change", renderDashboard);
      document.getElementById("f-supervisor").addEventListener("change", renderDashboard);
      document.getElementById("f-coordenador").addEventListener("change", renderDashboard);
      document.getElementById("f-estado").addEventListener("change", renderDashboard);
    });

    function popularMesAno() {
      const anoAtual = new Date().getFullYear();
      const mesAtual = MESES_LIST[new Date().getMonth()];
      document.getElementById("f-mes").innerHTML =
        `<option value="">Todos os meses</option>` +
        MESES_LIST.map(m => `<option value="${m}" ${m===mesAtual?'selected':''}>${m}</option>`).join("");
      let anosOpt = `<option value="">Todos os anos</option>`;
      for (let a = anoAtual-1; a <= anoAtual+1; a++)
        anosOpt += `<option value="${a}" ${a===anoAtual?'selected':''}>${a}</option>`;
      document.getElementById("f-ano").innerHTML = anosOpt;
    }

    async function carregarTodos() {
      try {
        // Carrega todos os dados sem filtro de índice composto
        const snap = await db.collection("ordens_servico").limit(2000).get();
        dadosAtuais = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        dadosAtuais.forEach(o => { o.statusNorm = normalizarStatus(o.status); });

        popularSelect("f-supervisor",  dadosAtuais, "supervisao",  "Todos supervisores");
        popularSelect("f-coordenador", dadosAtuais, "coordenador", "Todos coordenadores");
        popularSelect("f-estado",      dadosAtuais, "estado",      "Todos os estados");

        document.getElementById("loading").style.display = "none";
        document.getElementById("dashboard-content").style.display = "block";
        renderDashboard();
      } catch(e) {
        document.getElementById("loading").innerHTML =
          `<span style="color:#C00000">Erro: ${e.message}</span>`;
      }
    }

    function renderDashboard() {
      const mes  = document.getElementById("f-mes").value;
      const ano  = document.getElementById("f-ano").value;
      const sup  = document.getElementById("f-supervisor").value;
      const coord= document.getElementById("f-coordenador").value;
      const est  = document.getElementById("f-estado").value;

      const lista = dadosAtuais.filter(o => {
        if (mes   && (o.mes||"").toUpperCase() !== mes)   return false;
        if (ano   && String(o.ano) !== String(ano))       return false;
        if (sup   && o.supervisao  !== sup)               return false;
        if (coord && o.coordenador !== coord)             return false;
        if (est   && o.estado      !== est)               return false;
        return true;
      });

      const ind = calcularIndicadores(lista);
      renderKPIs(ind);
      renderCharts(ind, lista);
      renderTabelaSupervisores(lista);
    }

    function renderKPIs(ind) {
      document.getElementById("kpi-grid").innerHTML = `
        <div class="kpi-card"><div class="kpi-icon">📋</div>
          <div class="kpi-info"><div class="kpi-label">OS Programadas</div><div class="kpi-value">${ind.programadas}</div></div></div>
        <div class="kpi-card success-card"><div class="kpi-icon">✅</div>
          <div class="kpi-info"><div class="kpi-label">OS Concluídas</div><div class="kpi-value">${ind.concluidas}</div></div></div>
        <div class="kpi-card warning-card"><div class="kpi-icon">🔧</div>
          <div class="kpi-info"><div class="kpi-label">Em Andamento</div><div class="kpi-value">${ind.emExecucao}</div></div></div>
        <div class="kpi-card danger-card"><div class="kpi-icon">⏰</div>
          <div class="kpi-info"><div class="kpi-label">Em Atraso</div><div class="kpi-value">${ind.emAtraso}</div></div></div>
        <div class="kpi-card"><div class="kpi-icon">👥</div>
          <div class="kpi-info"><div class="kpi-label">Sem Equipe</div><div class="kpi-value">${ind.semEquipe}</div></div></div>
        <div class="kpi-card accent-card"><div class="kpi-icon">🚨</div>
          <div class="kpi-info"><div class="kpi-label">Total</div><div class="kpi-value large">${ind.total}</div></div></div>
        <div class="kpi-card"><div class="kpi-icon">🎯</div>
          <div class="kpi-info"><div class="kpi-label">Meta Estimada</div><div class="kpi-value">100,00%</div></div></div>
        <div class="kpi-card success-card"><div class="kpi-icon">📈</div>
          <div class="kpi-info"><div class="kpi-label">Taxa de Conclusão</div>
          <div class="kpi-value">${Number(ind.taxaConclusao).toLocaleString("pt-BR",{minimumFractionDigits:2})}%</div></div></div>`;
    }

    function renderCharts(ind, lista) {
      if (chartGauge) chartGauge.destroy();
      const taxa = parseFloat(ind.taxaConclusao);
      chartGauge = new Chart(document.getElementById("chart-gauge").getContext("2d"), {
        type:"doughnut",
        data:{datasets:[{data:[taxa,100-taxa],backgroundColor:["#00B050","#e2e8f0"],borderWidth:0,circumference:180,rotation:270}]},
        options:{cutout:"70%",responsive:true,plugins:{legend:{display:false},tooltip:{enabled:false}}}
      });
      document.getElementById("gauge-val").textContent = taxa.toLocaleString("pt-BR",{minimumFractionDigits:2})+"%";

      if (chartCrono) chartCrono.destroy();
      chartCrono = new Chart(document.getElementById("chart-cronograma").getContext("2d"), {
        type:"doughnut",
        data:{labels:["Cumprido","Alterado"],datasets:[{data:[ind.pctCumprido,ind.pctAlterado],backgroundColor:["#1a2a4a","#4DA6FF"],borderWidth:0}]},
        options:{responsive:true,plugins:{legend:{position:"bottom"}}}
      });

      const statusCount = {};
      lista.forEach(o=>{const st=normalizarStatus(o.status);statusCount[st]=(statusCount[st]||0)+1;});
      const stLabels = Object.keys(statusCount);
      if (chartPizza) chartPizza.destroy();
      chartPizza = new Chart(document.getElementById("chart-pizza").getContext("2d"), {
        type:"pie",
        data:{labels:stLabels,datasets:[{data:stLabels.map(s=>statusCount[s]),backgroundColor:stLabels.map(s=>(STATUS_CONFIG[s]||{cor:"#999"}).cor),borderWidth:1}]},
        options:{responsive:true,plugins:{legend:{position:"right",labels:{boxWidth:12,font:{size:10}}}}}
      });

      const porSup = porSupervisor(lista);
      if (chartSup) chartSup.destroy();
      const canvas = document.getElementById("chart-supervisor");
      canvas.height = Math.max(200, porSup.length*30);
      chartSup = new Chart(canvas.getContext("2d"), {
        type:"bar",
        data:{labels:porSup.map(s=>s.supervisao),datasets:[
          {label:"Programadas",data:porSup.map(s=>s.programadas),backgroundColor:"#4DA6FF"},
          {label:"Concluídas", data:porSup.map(s=>s.concluidas), backgroundColor:"#00B050"},
          {label:"Em Execução",data:porSup.map(s=>s.emExecucao), backgroundColor:"#FF9900"},
          {label:"Em Atraso",  data:porSup.map(s=>s.emAtraso),   backgroundColor:"#C00000"},
          {label:"Sem Equipe", data:porSup.map(s=>s.semEquipe),  backgroundColor:"#843C0C"}
        ]},
        options:{indexAxis:"y",responsive:true,plugins:{legend:{position:"top",labels:{boxWidth:12,font:{size:10}}}},scales:{x:{stacked:false},y:{ticks:{font:{size:10}}}}}
      });
    }

    function renderTabelaSupervisores(lista) {
      const porSup = porSupervisor(lista);
      document.getElementById("tabela-supervisores").innerHTML = porSup.length
        ? porSup.map(s=>{
            const tot=s.programadas+s.concluidas+s.emExecucao+s.emAtraso+s.semEquipe;
            const taxa=tot>0?((s.concluidas/tot)*100).toFixed(1):0;
            return `<tr>
              <td><strong>${s.supervisao}</strong></td>
              <td style="color:#4DA6FF;font-weight:600">${s.programadas}</td>
              <td style="color:#00B050;font-weight:600">${s.concluidas}</td>
              <td style="color:#FF9900;font-weight:600">${s.emExecucao}</td>
              <td style="color:#C00000;font-weight:600">${s.emAtraso}</td>
              <td style="color:#843C0C;font-weight:600">${s.semEquipe}</td>
              <td><strong>${taxa}%</strong></td>
            </tr>`;
          }).join("")
        : `<tr><td colspan="7"><div class="empty-state"><p>Nenhum dado</p></div></td></tr>`;
    }

    function exportarResumo() {
      const mes=document.getElementById("f-mes").value;
      const ano=document.getElementById("f-ano").value;
      const lista=dadosAtuais.filter(o=>{
        if(mes&&(o.mes||"").toUpperCase()!==mes)return false;
        if(ano&&String(o.ano)!==String(ano))return false;
        return true;
      });
      exportarExcel(porSupervisor(lista).map(s=>({
        Supervisor:s.supervisao,Programadas:s.programadas,Concluídas:s.concluidas,
        EmExecução:s.emExecucao,EmAtraso:s.emAtraso,SemEquipe:s.semEquipe
      })),"resumo_supervisores");
    }
  </script>
</body>
</html>
