              <span><span style="display:inline-block;width:12px;height:3px;background:#C00000;margin-right:4px;vertical-align:middle"></span>Meta do dia</span>
            </div>
          </div>
          <div class="chart-card"><h3>Distribuição por Status</h3><canvas id="chart-pizza"></canvas></div>
        </div>
        <div class="chart-card" style="margin-bottom:16px">
          <h3>Conclusão por Supervisor (unidades únicas)</h3>
          <div style="overflow-y:auto;max-height:400px"><canvas id="chart-sup"></canvas></div>
        </div>
        <div class="table-card">
          <div class="table-header">
            <h3>Resumo por Supervisor</h3>
            <button class="btn btn-outline btn-sm" onclick="exportarResumo()">⬇ Excel</button>
          </div>
          <table>
            <thead><tr><th>Supervisor</th><th>Programadas</th><th>Concluídas</th><th>Em Execução</th><th>Em Atraso</th><th>Sem Equipe</th><th>Taxa %</th></tr></thead>
            <tbody id="tbody-sup"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    let dados=[], cG, cP, cS;

    // ── Lógica de dias úteis ──────────────────────────────────
    function diasUteis(ano, mesIdx, ate) {
      const fim = ate || new Date(ano, mesIdx+1, 0).getDate();
      let c=0;
      for(let d=1;d<=fim;d++){const dow=new Date(ano,mesIdx,d).getDay();if(dow!==0&&dow!==6)c++;}
      return c;
    }

    function calcularMeta(mes, anoStr) {
      const mesIdx = MESES.indexOf(mes);
      if(mesIdx<0) return {meta:100, totalUteis:21, hojeUteis:21};
      const ano = parseInt(anoStr);
      const hoje = new Date();
      const totalUteis = diasUteis(ano, mesIdx);
      let hojeUteis;
      const isMesAtual = hoje.getFullYear()===ano && hoje.getMonth()===mesIdx;
      if(isMesAtual) {
        hojeUteis = diasUteis(ano, mesIdx, hoje.getDate());
      } else if(new Date(ano, mesIdx+1, 1) < hoje) {
        hojeUteis = totalUteis; // mês passado = 100%
      } else {
        hojeUteis = 0; // mês futuro = 0%
      }
      const meta = totalUteis>0 ? (hojeUteis/totalUteis)*100 : 0;
      return {meta, totalUteis, hojeUteis};
    }
