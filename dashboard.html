<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ManEng BI — Dashboard</title>
  <link rel="stylesheet" href="/maneng-bi/css/main.css">
</head>
<body>
  <aside class="sidebar"><div class="sidebar-logo"><span>man<span class="accent">eng</span></span></div><div id="sidebar"></div></aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-title">Dashboard Manutenção</div>
      <div class="topbar-filters">
        <select id="f-mes"></select>
        <select id="f-ano"></select>
        <select id="f-supervisor"><option value="">Todos supervisores</option></select>
        <select id="f-coordenador"><option value="">Todos coordenadores</option></select>
        <select id="f-estado"><option value="">Todos os estados</option></select>
      </div>
    </div>
    <div class="content">
      <div id="loading" class="loading"><div class="spinner"></div> Carregando dados...</div>
      <div id="dash" style="display:none">
        <div class="kpi-grid" id="kpi-grid"></div>
        <div class="charts-grid">
          <div class="chart-card">
            <h3>Taxa de Conclusão vs Meta</h3>
            <canvas id="chart-gauge" height="160"></canvas>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding:0 8px">
              <span style="font-size:.75rem;color:#718096">0,00%</span>
              <div style="text-align:center">
                <div id="gauge-val" style="font-size:1.8rem;font-weight:700;color:#1a2a4a"></div>
                <div id="meta-val" style="font-size:.8rem;color:#C00000;font-weight:600"></div>
              </div>
              <span style="font-size:.75rem;color:#718096">100,00%</span>
            </div>
            <div style="display:flex;gap:16px;justify-content:center;margin-top:8px;font-size:.75rem">
              <span><span style="display:inline-block;width:12px;height:12px;background:#1a2a4a;border-radius:2px;margin-right:4px"></span>Realizado</span>
              <span><span style="display:inline-block;width:12px;height:3px;background:#C00000;margin-right:4px;vertical-align:middle"></span>Meta do dia</span>
            </div>
          </div>
          <div class="chart-card"><h3>Distribuição por Status</h3><canvas id="chart-pizza"></canvas></div>
        </div>
        <div class="chart-card" style="margin-bottom:16px">
          <h3>Conclusão por Supervisor</h3>
          <div style="overflow-y:auto;max-height:400px"><canvas id="chart-sup"></canvas></div>
        </div>
        <div class="table-card">
          <div class="table-header">
            <h3>Resumo por Supervisor</h3>
            <button class="btn btn-outline btn-sm" onclick="exportarResumo()">⬇ Excel</button>
          </div>
          <table>
            <thead><tr><th>Supervisor</th><th>Programadas</th><th>Concluídas</th><th>Em Execução</th><th>Em Atraso</th><th>Sem Equipe</th><th>Taxa %</th></tr></thead>
            <tbody id="tbody-sup"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <script src="/maneng-bi/js/config.js"></script>
