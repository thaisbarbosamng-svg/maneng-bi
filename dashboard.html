<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ManEng BI — Dashboard</title>
  <link rel="stylesheet" href="/maneng-bi/css/main.css">
</head>
<body>
  <aside class="sidebar"><div class="sidebar-logo"><span>man<span class="accent">eng</span></span></div><div id="sidebar"></div></aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-title">Dashboard Manutenção</div>
      <div class="topbar-filters">
        <select id="f-mes"></select>
        <select id="f-ano"></select>
        <select id="f-supervisor"><option value="">Todos supervisores</option></select>
        <select id="f-coordenador"><option value="">Todos coordenadores</option></select>
        <select id="f-estado"><option value="">Todos os estados</option></select>
      </div>
    </div>
    <div class="content">
      <div id="loading" class="loading"><div class="spinner"></div> Carregando dados...</div>
      <div id="dash" style="display:none">
        <div class="kpi-grid" id="kpi-grid"></div>
        <div class="charts-grid">
          <div class="chart-card">
            <h3>Taxa de Conclusão vs Meta</h3>
            <canvas id="chart-gauge" height="160"></canvas>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding:0 8px">
              <span style="font-size:.75rem;color:#718096">0,00%</span>
              <div style="text-align:center">
                <div id="gauge-val" style="font-size:1.8rem;font-weight:700;color:#1a2a4a"></div>
                <div id="meta-val" style="font-size:.8rem;color:#C00000;font-weight:600"></div>
              </div>
              <span style="font-size:.75rem;color:#718096">100,00%</span>
            </div>
            <div style="display:flex;gap:16px;justify-content:center;margin-top:8px;font-size:.75rem">
              <span><span style="display:inline-block;width:12px;height:12px;background:#1a2a4a;border-radius:2px;margin-right:4px"></span>Realizado</span>
              <span><span style="display:inline-block;width:12px;height:3px;background:#C00000;margin-right:4px;vertical-align:middle"></span>Meta do dia</span>
            </div>
          </div>
          <div class="chart-card"><h3>Distribuição por Status</h3><canvas id="chart-pizza"></canvas></div>
        </div>
        <div class="chart-card" style="margin-bottom:16px">
          <h3>Conclusão por Supervisor (unidades únicas)</h3>
          <div style="overflow-y:auto;max-height:400px"><canvas id="chart-sup"></canvas></div>
        </div>
        <div class="table-card">
          <div class="table-header">
            <h3>Resumo por Supervisor</h3>
            <button class="btn btn-outline btn-sm" onclick="exportarResumo()">⬇ Excel</button>
          </div>
          <table>
            <thead><tr><th>Supervisor</th><th>Programadas</th><th>Realizadas</th><th>Em Execução</th><th>Em Atraso</th><th>Sem Equipe</th><th>Taxa %</th></tr></thead>
            <tbody id="tbody-sup"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <script src="/maneng-bi/js/config.js"></script>
  <script src="/maneng-bi/js/auth.js"></script>
  <script>
    let dados=[], cP, cS;

    // Excluídos da base de cálculo (não executados no mês)
    const EXCECOES = [
      "DISTRATO DE CONTRATO","DISTRATO","LOJA FECHADA","LOJA EM REFORMA",
      "NÃO POSSUI GALERIA NESTA LOJA","RESIDENTE","CANCELADO",
      "CONFORME CRONOGRAMA"  // periodicidade não cai neste mês → não conta
    ];

    // Conta como realizada para a taxa
    const REALIZADAS = ["CONCLUIDA","VALIDADA","AUDITADA","FATURADA","EM EXECUÇÃO","EM EXECUCAO"];

    const PRIO = [
      "FATURADA","AUDITADA","VALIDADA","CONCLUIDA","EM EXECUÇÃO","EM ATRASO","SEM EQUIPE",
      "PROGRAMADO","PROGRAMADA","CONFORME CRONOGRAMA","DISTRATO DE CONTRATO","DISTRATO",
      "LOJA FECHADA","LOJA EM REFORMA","NÃO POSSUI GALERIA NESTA LOJA","RESIDENTE","CANCELADO"
    ];

    // Feriados nacionais Brasil 2025-2027
    const FERIADOS = new Set([
      "2025-01-01","2025-03-03","2025-03-04","2025-04-18","2025-04-21","2025-05-01",
      "2025-06-19","2025-09-07","2025-10-12","2025-11-02","2025-11-15","2025-11-20","2025-12-25",
      "2026-01-01","2026-02-16","2026-02-17","2026-04-03","2026-04-21","2026-05-01",
      "2026-06-04","2026-09-07","2026-10-12","2026-11-02","2026-11-15","2026-11-20","2026-12-25",
      "2027-01-01","2027-02-15","2027-02-16","2027-04-02","2027-04-21","2027-05-01",
      "2027-05-27","2027-09-07","2027-10-12","2027-11-02","2027-11-15","2027-11-20","2027-12-25"
    ]);

    function isDiaUtil(ano, mes, dia) {
      const dt = new Date(ano, mes, dia);
      const dow = dt.getDay();
      if(dow===0||dow===6) return false;
      const key = `${ano}-${String(mes+1).padStart(2,"0")}-${String(dia).padStart(2,"0")}`;
      return !FERIADOS.has(key);
    }

    function diasUteis(ano, mesIdx, ate) {
      const fim = ate || new Date(ano, mesIdx+1, 0).getDate();
      let c=0;
      for(let d=1;d<=fim;d++) if(isDiaUtil(ano,mesIdx,d)) c++;
      return c;
    }

    function calcularMeta(mes, anoStr) {
      const mesIdx=MESES.indexOf(mes);
      if(mesIdx<0) return {meta:100,totalUteis:0,hojeUteis:0};
      const ano=parseInt(anoStr), hoje=new Date();
      const totalUteis=diasUteis(ano,mesIdx);
      let hojeUteis;
      if(hoje.getFullYear()===ano && hoje.getMonth()===mesIdx)
        hojeUteis=diasUteis(ano,mesIdx,hoje.getDate());
      else if(new Date(ano,mesIdx+1,1)<=hoje) hojeUteis=totalUteis;
      else hojeUteis=0;
      return {meta:totalUteis>0?(hojeUteis/totalUteis)*100:0, totalUteis, hojeUteis};
    }

    function deduplicar(lista) {
      const por={};
      lista.forEach(os=>{
        const k=`${os.sigla}|${os.cliente}`, st=normalizarStatus(os.status);
        if(!por[k]){por[k]=st;return;}
        const ai=PRIO.indexOf(por[k]),bi=PRIO.indexOf(st);
        if(bi<ai) por[k]=st;
      });
      return Object.values(por);
    }

    function calcularIndicadoresUnidades(lista) {
      const sts  = deduplicar(lista);
      const base = sts.filter(s=>!EXCECOES.includes(s));
      const total      = base.length;
      const concluidas = base.filter(s=>REALIZADAS.includes(s)).length;
      const emAtraso   = base.filter(s=>s==="EM ATRASO").length;
      const emExecucao = base.filter(s=>["EM EXECUÇÃO","EM EXECUCAO"].includes(s)).length;
      const programadas= base.filter(s=>["PROGRAMADO","PROGRAMADA"].includes(s)).length;
      const semEquipe  = base.filter(s=>s==="SEM EQUIPE").length;
      return {total, concluidas, emAtraso, emExecucao, programadas, semEquipe,
              taxa: total>0?(concluidas/total)*100:0};
    }

    function porSupervisorUnidades(lista) {
      const porSup={};
      lista.forEach(os=>{
        const sup=os.supervisao||"Sem Supervisor", k=`${os.sigla}|${os.cliente}`;
        if(!porSup[sup])porSup[sup]={supervisao:sup,unidades:{}};
        const st=normalizarStatus(os.status);
        if(!porSup[sup].unidades[k]){porSup[sup].unidades[k]=st;return;}
        const ai=PRIO.indexOf(porSup[sup].unidades[k]),bi=PRIO.indexOf(st);
        if(bi<ai)porSup[sup].unidades[k]=st;
      });
      return Object.values(porSup).map(s=>{
        const base=Object.values(s.unidades).filter(x=>!EXCECOES.includes(x));
        return{supervisao:s.supervisao,
          concluidas: base.filter(x=>REALIZADAS.includes(x)).length,
          programadas:base.filter(x=>["PROGRAMADO","PROGRAMADA"].includes(x)).length,
          emExecucao: base.filter(x=>["EM EXECUÇÃO","EM EXECUCAO"].includes(x)).length,
          emAtraso:   base.filter(x=>x==="EM ATRASO").length,
          semEquipe:  base.filter(x=>x==="SEM EQUIPE").length};
      }).sort((a,b)=>b.concluidas-a.concluidas);
    }

    function desenharGauge(canvas, taxa, meta) {
      canvas.width=canvas.offsetWidth||400; canvas.height=180;
      const ctx=canvas.getContext("2d"),W=canvas.width,H=canvas.height;
      const cx=W/2,cy=H*0.95,r=Math.min(W*0.42,H*0.82);
      ctx.clearRect(0,0,W,H);
      // Fundo
      ctx.beginPath();ctx.arc(cx,cy,r,Math.PI,0);ctx.strokeStyle="#e2e8f0";ctx.lineWidth=26;ctx.stroke();
      // Realizado (azul escuro — igual ao BI original)
      if(taxa>0){
        const ang=Math.PI+(taxa/100)*Math.PI;
        ctx.beginPath();ctx.arc(cx,cy,r,Math.PI,ang);
        ctx.strokeStyle="#1a2a4a";ctx.lineWidth=26;ctx.lineCap="butt";ctx.stroke();
      }
      // Linha vermelha meta
      if(meta>0&&meta<=100){
        const angM=Math.PI+(meta/100)*Math.PI;
        ctx.beginPath();
        ctx.moveTo(cx+(r-22)*Math.cos(angM),cy+(r-22)*Math.sin(angM));
        ctx.lineTo(cx+(r+22)*Math.cos(angM),cy+(r+22)*Math.sin(angM));
        ctx.strokeStyle="#C00000";ctx.lineWidth=3;ctx.lineCap="round";ctx.stroke();
      }
    }

    requireAuth(async()=>{
      renderMenu("dashboard");
      const am=new Date().getFullYear(),mm=MESES[new Date().getMonth()];
      document.getElementById("f-mes").innerHTML=`<option value="">Todos os meses</option>`+MESES.map(m=>`<option value="${m}"${m===mm?" selected":""}>${m}</option>`).join("");
      let ao=`<option value="">Todos os anos</option>`;
      for(let a=am-1;a<=am+1;a++) ao+=`<option value="${a}"${a===am?" selected":""}>${a}</option>`;
      document.getElementById("f-ano").innerHTML=ao;
      try{
        dados=await carregarDados();
        popularSelect("f-supervisor", dados,"supervisao", "Todos supervisores");
        popularSelect("f-coordenador",dados,"coordenador","Todos coordenadores");
        popularSelect("f-estado",     dados,"estado",     "Todos os estados");
        document.getElementById("loading").style.display="none";
        document.getElementById("dash").style.display="block";
        renderD();
        ["f-mes","f-ano","f-supervisor","f-coordenador","f-estado"].forEach(id=>
          document.getElementById(id).addEventListener("change",renderD));
      }catch(e){
        document.getElementById("loading").innerHTML=`<span style="color:#C00000">Erro: ${e.message}</span>`;
      }
    });

    function renderD(){
      const mes=document.getElementById("f-mes").value,
            ano=document.getElementById("f-ano").value,
            sup=document.getElementById("f-supervisor").value,
            coord=document.getElementById("f-coordenador").value,
            est=document.getElementById("f-estado").value;
      const lista=dados.filter(o=>{
        if(mes  &&(o.mes||"").toUpperCase()!==mes) return false;
        if(ano  &&String(o.ano)!==String(ano))     return false;
        if(sup  &&o.supervisao !==sup)             return false;
        if(coord&&o.coordenador!==coord)           return false;
        if(est  &&o.estado     !==est)             return false;
        return true;
      });

      const ind=calcularIndicadoresUnidades(lista);
      const {meta,totalUteis,hojeUteis}=(mes&&ano)?calcularMeta(mes,ano):{meta:1
